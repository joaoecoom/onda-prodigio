<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respostas ao questionário — Onda Prodígio</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/comunidade/comunidade.css?v=20260812a">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('comunidade-theme') === 'light' ? 'light' : 'dark');</script>
</head>
<body>
    <div class="comunidade-shell">
        <header class="comunidade-topbar">
            <div class="comunidade-topbar__row comunidade-topbar__row--main">
                <div class="comunidade-topbar__identity">
                    <div class="comunidade-topbar__brand">
                        <img src="/comunidade/assets/mascot.png" alt="" class="comunidade-brand-mark" width="32" height="32">
                        Onda Prodígio <span>· Admin</span>
                    </div>
                    <div class="comunidade-topbar__user" id="topbar-user"></div>
                </div>
                <button type="button" class="comunidade-theme-toggle comunidade-topbar__theme" data-theme-toggle aria-label="Alternar tema">
                    <svg class="comunidade-theme-toggle__icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                    <svg class="comunidade-theme-toggle__icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
            <div class="comunidade-topbar__row comunidade-topbar__row--actions">
                <a class="comunidade-btn comunidade-btn--ghost" href="/comunidade">Comunidade</a>
                <button class="comunidade-btn comunidade-btn--ghost" type="button" id="btn-logout">Sair</button>
            </div>
        </header>

        <main class="comunidade-main comunidade-main--dashboard">
            <div class="comunidade-panel comunidade-respostas-panel" id="responses-root">
                <p class="comunidade-panel__subtitle" style="margin:0;padding:1.25rem;">A carregar…</p>
            </div>
        </main>
    </div>

    <script src="/comunidade/theme.js"></script>
    <script src="/comunidade/auth.js"></script>
    <script src="/comunidade/welcome-survey.js"></script>
    <script src="/comunidade/respostaquestionario.js"></script>
</body>
</html>
