<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir password — Comunidade Onda Prodígio</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/comunidade/comunidade.css?v=20260812b">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('comunidade-theme') === 'light' ? 'light' : 'dark');</script>
</head>
<body>
    <div class="comunidade-login-toolbar">
        <button type="button" class="comunidade-theme-toggle" data-theme-toggle aria-label="Alternar tema">
            <svg class="comunidade-theme-toggle__icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="comunidade-theme-toggle__icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
    <main class="comunidade-login-page">
        <section class="comunidade-login-card" aria-labelledby="reset-title">
            <img src="/comunidade/assets/mascot.png?v=20260812b" alt="Dr. Turbay, mascote Onda Prodígio" class="comunidade-mascot" width="400" height="400">
            <span class="comunidade-badge">Área de membros</span>
            <h1 id="reset-title">Redefinir password</h1>
            <p id="reset-subtitle">Escolhe uma nova password para entrares na comunidade.</p>

            <div class="comunidade-alert comunidade-alert--error" id="reset-error" hidden></div>
            <div class="comunidade-alert comunidade-alert--info" id="reset-info" hidden></div>

            <div class="comunidade-steps is-visible" id="step-reset-loading">
                <p>A validar link…</p>
            </div>

            <div class="comunidade-steps" id="step-reset-form">
                <div class="comunidade-form">
                    <div class="comunidade-field">
                        <label for="reset-email">Email</label>
                        <input id="reset-email" type="email" readonly>
                    </div>
                    <div class="comunidade-field">
                        <label for="reset-password">Nova password</label>
                        <input id="reset-password" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="comunidade-field">
                        <label for="reset-password-confirm">Confirmar password</label>
                        <input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <button class="comunidade-btn comunidade-btn--primary" type="button" id="btn-reset-password">Guardar e entrar</button>
                    <a class="comunidade-btn comunidade-btn--light" href="/comunidade/login">Voltar ao login</a>
                </div>
            </div>

            <div class="comunidade-steps" id="step-reset-invalid">
                <div class="comunidade-alert comunidade-alert--error">
                    Este link é inválido ou expirou.
                </div>
                <a class="comunidade-btn comunidade-btn--primary" href="/comunidade/login">Pedir novo link</a>
            </div>
        </section>
    </main>

    <script src="/comunidade/theme.js"></script>
    <script src="/comunidade/auth.js"></script>
    <script src="/comunidade/redefinir-password.js"></script>
</body>
</html>
