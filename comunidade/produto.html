<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto — Comunidade Onda Prodígio</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/comunidade/comunidade.css">
</head>
<body>
    <div class="comunidade-shell">
        <header class="comunidade-topbar">
            <div class="comunidade-topbar__left">
                <button class="comunidade-topbar__menu-btn" type="button" id="btn-toggle-sidebar" aria-label="Lista de módulos">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                </button>
                <div>
                    <div class="comunidade-topbar__brand">Onda Prodígio <span>· Comunidade</span></div>
                    <div class="comunidade-topbar__user" id="topbar-user"></div>
                </div>
            </div>
            <div class="comunidade-topbar__actions">
                <a class="comunidade-btn comunidade-btn--ghost" href="/comunidade">Meus cursos</a>
                <button class="comunidade-btn comunidade-btn--ghost" type="button" id="btn-logout">Sair</button>
            </div>
        </header>

        <div class="comunidade-sidebar-overlay" id="sidebar-overlay"></div>

        <div class="comunidade-layout">
            <aside class="comunidade-sidebar" id="sidebar">
                <div class="comunidade-sidebar__header">
                    <div class="comunidade-sidebar__title">Conteúdo do curso</div>
                    <div class="comunidade-sidebar__product-name" id="sidebar-product-name">A carregar…</div>
                </div>
                <div class="comunidade-module-list" id="module-list"></div>
            </aside>

            <main class="comunidade-main">
                <section class="comunidade-panel">
                    <div class="comunidade-player-wrap">
                        <div class="comunidade-player comunidade-player--empty" id="content-player">Selecciona um módulo</div>
                        <nav class="comunidade-lesson-nav" aria-label="Navegação entre módulos">
                            <button class="comunidade-lesson-nav__btn" type="button" id="btn-prev" disabled aria-label="Anterior">
                                <svg viewBox="0 0 320 512" fill="currentColor"><path d="M41.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 256 246.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg>
                                Anterior
                            </button>
                            <button class="comunidade-lesson-nav__btn" type="button" id="btn-list" aria-label="Lista">
                                <svg viewBox="0 0 512 512" fill="currentColor"><path d="M64 144a48 48 0 1 0 0-96 48 48 0 1 0 0 96zM192 64c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zM64 464a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm48-208a48 48 0 1 0-96 0 48 48 0 1 0 96 0z"/></svg>
                                Lista
                            </button>
                            <button class="comunidade-lesson-nav__btn" type="button" id="btn-next" disabled aria-label="Próximo">
                                <svg viewBox="0 0 320 512" fill="currentColor"><path d="M278.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-160 160c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L210.7 256 73.4 118.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l160 160z"/></svg>
                                Próximo
                            </button>
                        </nav>
                    </div>

                    <div class="comunidade-ebook-bar" id="ebook-download" hidden>
                        <span style="font-size:0.875rem;color:#374151;">Material disponível para download</span>
                        <a class="comunidade-btn comunidade-btn--primary" id="ebook-link" href="#" target="_blank" rel="noopener">Descarregar ebook</a>
                    </div>

                    <div class="comunidade-lesson-info">
                        <div class="comunidade-lesson-info__label">Informações da aula</div>
                        <div class="comunidade-lesson-info__title" id="lesson-title">—</div>
                        <div class="comunidade-lesson-info__desc" id="lesson-description"></div>
                    </div>
                </section>

                <section class="comunidade-panel comunidade-comments-panel">
                    <h2 class="comunidade-panel__title">Comentários</h2>
                    <p class="comunidade-panel__subtitle" style="margin-bottom:0;">Deixa a tua dúvida ou partilha a tua experiência. A equipa responde por aqui.</p>

                    <div class="comunidade-alert comunidade-alert--error" id="comments-error" hidden></div>

                    <form class="comunidade-form" id="comment-form" style="margin-top:1rem;">
                        <div class="comunidade-field">
                            <label for="comment-content">Novo comentário</label>
                            <textarea id="comment-content" placeholder="Escreve aqui…" required></textarea>
                        </div>
                        <button class="comunidade-btn comunidade-btn--primary" type="submit">Publicar comentário</button>
                    </form>

                    <div class="comunidade-comments" id="comments-list"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="/comunidade/auth.js"></script>
    <script src="/comunidade/produto.js"></script>
</body>
</html>
